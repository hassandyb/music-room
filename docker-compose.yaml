services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - music-room

  redis:
    image: redis:latest
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - music-room

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - ./apps/api/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      BACKEND_URL: ${PUBLIC_URL}
      WEB_URL: ${PUBLIC_URL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # /api is the public root route (see app.controller.ts, @Public()) —
    # no auth needed, just proof the Nest app has finished booting and is
    # actually accepting connections (migrations run before this point).
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080/api', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s
    volumes:
      - ./apps/api/uploads:/repo/apps/api/uploads
    networks:
      - music-room

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_URL}
        NEXT_PUBLIC_SOCKET_URL: ${PUBLIC_URL}
        NEXT_PUBLIC_BACKEND_URL: ${PUBLIC_URL}
    environment:
      API_INTERNAL_URL: http://api:8080
    depends_on:
      api:
        condition: service_healthy
    networks:
      - music-room

  nginx:
    build:
      context: ./nginx
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    ports:
      - "8000:80"
    networks:
      - music-room

volumes:
  postgres_data:
  redis_data:

networks:
  music-room:
    driver: bridge